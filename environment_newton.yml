# Lean environment for the Phase 5 GPT-2 Coconut runs on Newton (plan: docs/planning/gpt2_coconut_phase5_impl.md).
# Same versions as environment.yml for the shared packages. No tensorflow / wandb / BLEURT: not needed for GSM8K.
# conda-forge only ("nodefaults"), so conda never touches the Anaconda "defaults" channel (no Terms-of-Service prompt).
#   conda env create -f environment_newton.yml
name: neuroAI_project
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - pip:
    - torch==2.6.0
    - numpy==2.1.3
    - transformers==4.52.4
    - datasets==3.6.0
    - tokenizers==0.21.1
    - tqdm==4.67.0
    - pyyaml
    - scipy
    - matplotlib
    - jupyter
    - nbconvert
    - ipykernel
